[package]
name = "matrix-macropad"
version = "1.0.1"
description = "Matrix Macropad Desktop Bridge & Configurator"
authors = ["Davidha73"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.5"
enigo = { version = "0.2" }
dirs = "5.0"
base64 = "0.22"
